<!DOCTYPE html>

<body>
    <script>
        async function fazRequest(url) {
            const response = await fetch(url);
            const data = await response.json();
            return data;
        }
        (async () => {
            const resultado = await fazRequest("https://api.api-onepiece.com/v2/sagas/en");
            console.log(resultado);
        });  
    </script>
</body>
