<!DOCTYPE html>

</head>

<body>
    <script>
        function multiply(n1, n2, callback) {
            const multiply = n1 * n2;
            callback(multiply);
        }

        multiply(2,3, function(result){
            console.log(result);
            const add = result + 5;
            console.log("Add:", add);
        })
    </script>
</body>
