<body>
    <script>
        function sequenciaPromises() {
            return new Promise(function (resolve, reject) {
                resolve(5);
            })
                .then(value => value * 2)
                .then(value => value + 5);
        }

        sequenciaPromises().then(result => console.log(result)); 
    </script>
