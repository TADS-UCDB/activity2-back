<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex11</title>
</head>

<body>
    <script>
        const promise1 = new Promise((resolve) => {
            return setTimeout(() => {
                return resolve('Primeira promise resolvida')
            }, 2000)
        });
        const promise2 = new Promise((resolve) => {
            return setTimeout(() => {
                return resolve('Segunda promise resolvida')
            }, 3000)
        });

        Promise.all([promise1, promise2]).then(result => {
            console.log(result);
        });
    </script>
</body>

</html>
