<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex5</title>
</head>
<body>
    <script>
        function myTimeout(time, callback){
            setTimeout(callback, time);
        }
        myTimeout(2000, ()=>{
            console.log("Callback executed after 2 sec")
        })
    </script>
</body>
</html>
